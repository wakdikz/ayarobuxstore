
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAKDIKZ GIG ROBUX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--pink:#ff69c7;
--purple:#a855f7;
--light:#ffe7fa;
--dark:#230b2d;
}

body{
font-family:Arial,sans-serif;
color:white;
min-height:100vh;
background:linear-gradient(135deg,#180923,#4b145e,#b52b94,#5425a6);
background-size:300% 300%;
animation:bg 12s ease infinite;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* MATRIX */

#matrix{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:-1;
opacity:.28;
pointer-events:none;
}

/* HEADER */

header{
text-align:center;
padding:35px 15px 25px;
}

.logo{
width:70px;
height:70px;
margin:auto;
display:grid;
place-items:center;
transform:rotate(-10deg);
border:3px solid white;
border-radius:18px;
background:linear-gradient(135deg,#ff68ca,#9e4aff);
box-shadow:0 0 30px #ff63d9;
}

.logo svg{
width:48px;
height:48px;
}

header h1{
margin-top:20px;
font-size:clamp(24px,6vw,38px);
font-weight:900;
background:linear-gradient(90deg,#fff,#ff9de7,#d7a8ff);
-webkit-background-clip:text;
color:transparent;
text-shadow:0 0 25px #ff5bd5;
}

header p{
margin-top:10px;
color:#ffd5f5;
font-size:12px;
letter-spacing:3px;
}

/* CONTENT */

.container{
width:100%;
max-width:700px;
margin:auto;
padding:15px;
}

.panel{
padding:20px;
margin-bottom:18px;
border:1px solid #ffb1ef66;
border-radius:22px;
background:#220d31c9;
backdrop-filter:blur(12px);
box-shadow:0 0 25px #e95aff25;
}

.title{
font-size:17px;
margin-bottom:17px;
color:#ffd6f7;
}

/* CUSTOM */

.custom{
width:100%;
padding:20px;
border-radius:18px;
border:1px solid #ffb7f5;
background:linear-gradient(135deg,#ff4bc4,#a64dff,#5423a8);
color:white;
cursor:pointer;
text-align:left;
box-shadow:0 0 25px #ff53dd55;
transition:.2s;
}

.custom:hover{
transform:translateY(-3px);
box-shadow:0 0 35px #ff53dd;
}

.custom strong{
display:block;
font-size:19px;
margin-bottom:7px;
}

.custom span{
font-size:12px;
opacity:.85;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:11px;
}

.card{
position:relative;
padding:18px 5px;
text-align:center;
border-radius:17px;
border:1px solid #f9a8ff50;
background:linear-gradient(145deg,#39164c,#241032);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
border-color:#ff8ce5;
}

.card.selected{
border:2px solid #ff7be1;
background:linear-gradient(145deg,#822b83,#45266e);
box-shadow:0 0 20px #ff5bd855;
}

.card h3{
font-size:13px;
margin-top:12px;
}

.card p{
font-size:11px;
color:#e9baff;
margin-top:7px;
}

.card .check{
display:none;
position:absolute;
top:7px;
right:8px;
color:#ffb6ed;
}

.card.selected .check{
display:block;
}

/* ROBUX SVG */

.robux{
width:42px;
height:42px;
margin:auto;
display:grid;
place-items:center;
background:linear-gradient(135deg,#ff72d2,#a05cff);
border-radius:12px;
box-shadow:0 0 15px #ff72d266;
}

.robux svg{
width:29px;
height:29px;
}

/* FORM */

input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:1px solid #bd77d9;
background:#160b23;
color:white;
outline:none;
}

input:focus{
border-color:#ff8be8;
box-shadow:0 0 12px #ff5bdb55;
}

input::placeholder{
color:#bd9acb;
}

.btn{
width:100%;
padding:15px;
margin-top:14px;
border:0;
border-radius:13px;
background:linear-gradient(90deg,#ff58bf,#b05aff);
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px #ff52ce40;
}

.btn:active{
transform:scale(.98);
}

.info{
margin-top:15px;
padding:15px;
border-radius:12px;
background:#ffffff0b;
color:#e6c9f4;
font-size:13px;
line-height:2;
}

.info b{
color:#ffb4e9;
}

/* DONE MODAL */

.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:#100719e8;
backdrop-filter:blur(10px);
z-index:10;
}

.modal.show{
display:flex;
}

.done-box{
width:100%;
max-width:330px;
padding:30px 20px;
text-align:center;
border:1px solid #ffffff30;
border-radius:25px;
background:linear-gradient(145deg,#29113c,#421650);
box-shadow:0 0 50px #d34cff35;
animation:pop .35s ease;
}

@keyframes pop{
from{transform:scale(.7);opacity:0}
to{transform:scale(1);opacity:1}
}

.check-circle{
width:85px;
height:85px;
margin:0 auto 20px;
border-radius:50%;
background:#12c980;
display:grid;
place-items:center;
box-shadow:0 0 35px #12c98055;
}

.check-circle svg{
width:48px;
height:48px;
stroke:white;
stroke-width:5;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
stroke-dasharray:60;
stroke-dashoffset:60;
animation:draw .6s .2s forwards;
}

@keyframes draw{
to{stroke-dashoffset:0}
}

.done-box h2{
color:#91ffd1;
margin-bottom:10px;
}

.done-box p{
font-size:13px;
color:#e8d5f5;
line-height:1.7;
}

.done-box .btn{
background:linear-gradient(90deg,#14bd7b,#21d69a);
}

footer{
text-align:center;
padding:25px;
color:#e7b7f5;
font-size:11px;
}

/* MOBILE */

@media(max-width:400px){
.container{padding:10px}
.panel{padding:15px}
.grid{gap:8px}
.card{padding:15px 3px}
.card h3{font-size:11px}
.card p{font-size:10px}
.robux{width:37px;height:37px}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<header>

<div class="logo">

<!-- CUSTOM ROBUX LOGO -->

<svg viewBox="0 0 100 100" fill="white">
<g transform="rotate(18 50 50)">
<path d="M18 18L82 18L82 82L18 82Z"/>
<path d="M39 39L61 39L61 61L39 61Z"
fill="#9d48cf"/>
</g>
</svg>

</div>

<h1>WAKDIKZ GIG ROBUX</h1>

<p>✦ PREMIUM ROBUX STORE ✦</p>

</header>

<div class="container">

<!-- CUSTOM PAKET -->

<div class="panel">

<h2 class="title">✧ CUSTOM ROBUX ✧</h2>

<button class="custom" onclick="customPackage()">

<strong>💎 CUSTOM YOUR ROBUX</strong>

<span>Atur jumlah Robux sesuai keinginan</span>

</button>

<input
id="customAmount"
type="number"
min="1"
max="1000000"
placeholder="Masukkan jumlah Robux custom"
>

</div>

<!-- PAKET -->

<div class="panel">

<h2 class="title">♡ PILIH PAKET ROBUX ♡</h2>

<div class="grid" id="grid"></div>

</div>

<!-- USERNAME -->

<div class="panel">

<h2 class="title">🎀 DETAIL PESANAN</h2>

<input
id="username"
type="text"
placeholder="Masukkan username Roblox"
autocomplete="off"
>

<div class="info">

Robux:
<b id="amount">Belum dipilih</b>

<br>

Username:
<b id="userPreview">Belum diisi</b>

<br>

Status:
<b>Menunggu pengiriman</b>

</div>

<button class="btn" onclick="sendOrder()">
♡ KIRIM PESANAN ♡
</button>

</div>

</div>

<footer>
♡ WAKDIKZ GIG ROBUX ♡
<br><br>
PINK PURPLE PREMIUM EDITION
</footer>

<!-- DONE ANIMATION -->

<div class="modal" id="modal">

<div class="done-box">

<div class="check-circle">

<svg viewBox="0 0 50 50">
<path d="M10 26L21 37L41 14"/>
</svg>

</div>

<h2>DONE!</h2>

<p id="doneText"></p>

<p style="margin-top:12px;color:#ffb5eb">
Pesanan tersimpan di tampilan ini.
</p>

<button class="btn" onclick="closeModal()">
OK ♡
</button>

</div>

</div>

<script>

// ==============================
// PAKET
// ==============================

const packages = [
100,
200,
300,
500,
1000,
2000
];

let selected = null;

const grid = document.getElementById("grid");

const logo = `
<div class="robux">
<svg viewBox="0 0 100 100" fill="white">
<g transform="rotate(18 50 50)">
<path d="M18 18H82V82H18Z"/>
<path d="M39 39H61V61H39Z" fill="#a54dd5"/>
</g>
</svg>
</div>
`;

packages.forEach(amount => {

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<span class="check">✓</span>
${logo}
<h3>${amount.toLocaleString("id-ID")} Robux</h3>
<p>♡ ROBUX PACKAGE</p>
`;

card.onclick = () => {

document.querySelectorAll(".card").forEach(c =>
c.classList.remove("selected")
);

card.classList.add("selected");

selected = amount;

document.getElementById("customAmount").value = "";

updatePreview();

};

grid.appendChild(card);

});

// ==============================
// CUSTOM PAKET
// ==============================

function customPackage(){

const amount = Number(
document.getElementById("customAmount").value
);

if(!Number.isInteger(amount) || amount < 1 || amount > 1000000){

alert("Masukkan jumlah Robux 1 sampai 1.000.000");

return;

}

document.querySelectorAll(".card").forEach(c =>
c.classList.remove("selected")
);

selected = amount;

updatePreview();

}

// ==============================
// PREVIEW
// ==============================

function updatePreview(){

document.getElementById("amount").textContent =
selected ?
selected.toLocaleString("id-ID") + " Robux" :
"Belum dipilih";

document.getElementById("userPreview").textContent =
document.getElementById("username").value.trim() ||
"Belum diisi";

}

document.getElementById("username").addEventListener(
"input",
updatePreview
);

// ==============================
// SEND - VISUAL ONLY
// ==============================

function sendOrder(){

const username =
document.getElementById("username").value.trim();

if(!username){

alert("Masukkan username Roblox dulu!");

return;

}

if(!selected){

alert("Pilih paket Robux dulu!");

return;

}

// SIMULASI KONFIRMASI.
// TIDAK MENGIRIM KE WA.
// TIDAK MEMPROSES PEMBAYARAN.
// TIDAK MENGIRIM ROBUX.

document.getElementById("doneText").textContent =
"Username: " + username +
" | Paket: " +
selected.toLocaleString("id-ID") +
" Robux";

document.getElementById("modal").classList.add("show");

}

function closeModal(){

document.getElementById("modal").classList.remove("show");

}

// ==============================
// PINK MATRIX
// ==============================

const canvas = document.getElementById("matrix");

const ctx = canvas.getContext("2d");

let width;
let height;
let drops;

const chars =
"♡✧0123456789ROBLOXWAKDIKZ";

function resize(){

width = canvas.width = window.innerWidth;

height = canvas.height = window.innerHeight;

drops = Array(
Math.ceil(width / 18)
).fill(1);

}

window.addEventListener("resize",resize);

resize();

function drawMatrix(){

ctx.fillStyle = "rgba(25, 5, 35, 0.12)";

ctx.fillRect(0,0,width,height);

ctx.font = "15px monospace";

for(let i = 0; i < drops.length; i++){

const char =
chars[Math.floor(Math.random()*chars.length)];

const x = i * 18;

const y = drops[i] * 18;

ctx.fillStyle =
Math.random() > .7 ?
"#ffb6f4" :
"#e94fc7";

ctx.fillText(char,x,y);

if(y > height && Math.random() > .975){

drops[i] = 0;

}

drops[i]++;

}

}

setInterval(drawMatrix,55);

</script>

</body>
    </html>
